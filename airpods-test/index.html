<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="AirPods Test"><meta name="theme-color" content="#111111"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="../apple-touch-icon-v2.png"><title>AirPods Test 3</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111;color:#fff;margin:0;min-height:100vh;display:grid;place-items:center;text-align:center}main{width:min(92vw,520px)}h1{font-size:30px}.num{font-size:88px;font-weight:800;margin:8px}.box{background:#222;border-radius:16px;padding:15px;margin:12px 0;line-height:1.5}button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:16px 20px;margin:5px}.log{font-size:14px;text-align:right;min-height:120px;white-space:pre-line}audio{width:100%}</style></head><body><main>
<h1>בדיקת AirPods — ניסוי 3</h1><div class="num" id="num">1</div>
<div class="box" id="status">שלב 1: לחץ "תפוס שליטת מדיה".</div>
<audio id="media" controls loop preload="auto" src="../mp4/alo/1_hundreds.mp4"></audio>
<button id="start">תפוס שליטת מדיה</button><button id="prev">הקודם</button><button id="next">הבא</button>
<div class="box">אחרי ההפעלה: פתח את מרכז הבקרה/מסך הנעילה. חפש נגן בשם <b>Pilates AirPods Test 3</b>. אם הוא מופיע, חזור לכאן ונסה לחיצה כפולה ומשולשת.</div>
<div class="box log" id="log">יומן:</div>
<script>
const m=document.getElementById('media'),num=document.getElementById('num'),status=document.getElementById('status'),log=document.getElementById('log');let n=1,ev=[];
function note(s){ev.unshift(new Date().toLocaleTimeString('he-IL')+' — '+s);ev=ev.slice(0,10);log.textContent='יומן:\n'+ev.join('\n')}
function move(d,s){n=Math.max(1,Math.min(34,n+d));num.textContent=n;note(s+' → '+n)}
function install(){if(!('mediaSession'in navigator)){status.textContent='Media Session API אינו זמין';return}
navigator.mediaSession.metadata=new MediaMetadata({title:'Pilates AirPods Test 3',artist:'Yaniv • Pilates 34',album:'AirPods control test'});
for(const [a,fn] of [['play',async()=>{note('PLAY');await m.play()}],['pause',()=>{note('PAUSE');m.pause()}],['nexttrack',()=>move(1,'NEXT TRACK')],['previoustrack',()=>move(-1,'PREVIOUS TRACK')]]){try{navigator.mediaSession.setActionHandler(a,fn)}catch(e){note(a+' unsupported')}}
note('Media Session registered')}
install();
m.addEventListener('play',()=>note('media PLAY event'));m.addEventListener('pause',()=>note('media PAUSE event'));
document.getElementById('next').onclick=()=>move(1,'כפתור');document.getElementById('prev').onclick=()=>move(-1,'כפתור');
document.getElementById('start').onclick=async()=>{install();m.muted=false;m.volume=.03;m.currentTime=0;try{await m.play();navigator.mediaSession.playbackState='playing';status.innerHTML='שלב 2: המדיה מתנגנת. <b>אל תפעיל Music/YouTube.</b> פתח עכשיו את מרכז הבקרה ובדוק מי מופיע כנגן הפעיל.';note('Requested active playback')}catch(e){status.textContent='ההפעלה נכשלה: '+e.message;note('play failed: '+e.message)}};
if("serviceWorker"in navigator){navigator.serviceWorker.register("./sw.js").then(()=>note("PWA service worker ready")).catch(e=>note("SW error: "+e.message))}
</script></main></body></html>
