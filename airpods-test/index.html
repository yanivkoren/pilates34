<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AirPods Test 2</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111;color:#fff;margin:0;min-height:100vh;display:grid;place-items:center;text-align:center}main{width:min(90vw,520px)}h1{font-size:30px}.num{font-size:92px;font-weight:800;margin:12px}.status,.log{background:#222;border-radius:16px;padding:15px;margin:14px 0;line-height:1.5}button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:15px 18px;margin:5px}.log{font-size:14px;text-align:right;min-height:120px;white-space:pre-line}video{width:100%;max-height:220px;border-radius:14px;background:#000}</style></head><body><main>
<h1>בדיקת AirPods — ניסוי 2</h1><div class="num" id="num">1</div>
<div class="status" id="status">לחץ "הפעל", ודא שהסרטון מתנגן, ואז נסה לחיצה אחת, כפולה ומשולשת.</div>
<video id="media" muted loop playsinline preload="auto" src="../mp4/alo/1_hundreds.mp4"></video>
<div><button id="start">הפעל</button><button id="prev">הקודם</button><button id="next">הבא</button></div>
<div class="log" id="log">יומן פקודות:</div>
<script>
const media=document.getElementById('media'),num=document.getElementById('num'),status=document.getElementById('status'),log=document.getElementById('log');let n=1,events=[];
function note(x){events.unshift(new Date().toLocaleTimeString('he-IL')+' — '+x);events=events.slice(0,8);log.textContent='יומן פקודות:\n'+events.join('\n')}
function move(d,src){n=Math.max(1,Math.min(34,n+d));num.textContent=n;note(src+' → תרגיל '+n)}
function handlers(){if(!('mediaSession'in navigator)){status.textContent='Media Session API לא זמין';return}
const set=(a,fn)=>{try{navigator.mediaSession.setActionHandler(a,fn)}catch(e){note(a+' לא נתמך')}};
set('play',async()=>{note('PLAY');try{await media.play()}catch(e){}});
set('pause',()=>{note('PAUSE');media.pause()});
set('nexttrack',()=>move(1,'NEXT TRACK'));
set('previoustrack',()=>move(-1,'PREVIOUS TRACK'));
set('seekforward',()=>note('SEEK FORWARD'));
set('seekbackward',()=>note('SEEK BACKWARD'));
navigator.mediaSession.metadata=new MediaMetadata({title:'AirPods Hardware Test',artist:'Pilates 34',album:'Test 2'});
note('Media Session handlers registered')}
handlers();
media.addEventListener('play',()=>note('video play event'));media.addEventListener('pause',()=>note('video pause event'));
document.getElementById('next').onclick=()=>move(1,'כפתור במסך');document.getElementById('prev').onclick=()=>move(-1,'כפתור במסך');
document.getElementById('start').onclick=async()=>{handlers();media.muted=false;media.volume=0.02;try{await media.play();status.textContent='הסרטון מתנגן. נסה: לחיצה אחת, כפולה ומשולשת על גבעול ה-AirPods.';note('בדיקה הופעלה')}catch(e){status.textContent='הפעלת המדיה נכשלה: '+e.message;note('play failed')}};
</script></main></body></html>
